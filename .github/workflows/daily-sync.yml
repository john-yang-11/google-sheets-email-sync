name: Daily sheet sync

# Scan the community repos for newly-posted Summer-2027 US software internships,
# then add the ones the sheet doesn't already track. 13:10 UTC is ~9am ET.
on:
  schedule:
    - cron: "10 13 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to scan (2 = the daily default)"
        required: false
        default: "2"

permissions:
  contents: write

concurrency:
  group: sheet-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scan for new listings
        env:
          WATCHLIST_CSV_URL: ${{ secrets.WATCHLIST_CSV_URL }}
        run: python scan_listings.py --days ${{ github.event.inputs.days || '2' }}

      - name: Sync to Google Sheet
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          # 'main internship companies' on johnyang1032@gmail. Not a secret -- just
          # the id from the URL of a sheet only the owner can open -- so it lives
          # here and a fresh clone works without setup. A SHEET_ID secret overrides
          # it, for repointing at another copy without a commit.
          SHEET_ID: ${{ secrets.SHEET_ID || '1CeKpdL35nNiAZVE7SnCYkspRDHCXboMzvDgKpc3l23o' }}
        run: python sheet_sync.py

      # found_log.json and sheet_pushed.json are the memory that stops tomorrow's
      # run re-adding today's rows. If this step fails, the next run repeats work.
      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || (git commit -m "Update sync state" && git pull --rebase && git push)
